# windows x64 ----------------------------------------------------------
 openblaswinx64:
  name: OPENBLAS (Windows x64)
  if: ${{ false }}
  runs-on: windows-2022
  steps:
   - name: Checkout Git repository
     uses: actions/checkout@v4

   - name: Setup Environment (Windows x64)
     uses: ilammy/msvc-dev-cmd@v1
     with:
      arch: amd64

   - name: Build OPENBLAS (Windows x64)
     shell: cmd
     run: |
      script\openblas-make.cmd x64

   - name: Compress Files (Windows x64)
     run: |
      dir x64
      zip -r openblas-x64.zip x64

   - name: Release OPENBLAS (Windows x64)
     uses: ncipollo/release-action@v1
     with:
      tag: build
      artifacts: "openblas-x64.zip"
      token: ${{ secrets.GITHUB_TOKEN }}
