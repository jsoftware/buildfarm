 webhook:
  name: Run Webhook
  runs-on: ubuntu-latest
# this needs is also in tests above
# comment out any needs not used by the webhook
  needs:
   - oblinux
   - obmacos
   - obmacosarm
   - obrpi64arm
   - obrpi32arm
   - obwin
   - obwin32
   - obwinarm64
   - obandroid
   - obwasm
   - obfreebsd
   - obopenbsd
   - obwin-msys2-x64-clang
   - obwin-msys2-x64
   - obwin-msys2-x86
   - obwin-msys2-arm64
  steps:
   - name: update server
     if: ${{ env.WEBHOOK == 'true' }}
     uses: distributhor/workflow-webhook@v2
     env:
      webhook_url: ${{ secrets.WEBHOOK_URL }}
      webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
      data: '{ "id": "obbuild" }'
