name: OPENBLAS

on:
 push:
  branches: [ master ]

# trigger workflow on file change
#on:
# push:
#  paths:
#   - 'version.txt'

# if: ${{ false }}

jobs:

# linux ----------------------------------------------------------------
 openblaslinux:
  name: OPENBLAS (Linux)
  runs-on: ubuntu-22.04
  steps:
   - name: Checkout Git repository
     uses: actions/checkout@v4

   - name: Setup Environment (Linux)
     run: script/install-lnx.sh

   - name: Build OPENBLAS (Linux)
     env:
      CC: clang
     run: |
      script/openblas-make.sh linux || exit 1

   - name: Release OPENBLAS (Linux)
     uses: ncipollo/release-action@v1
     with:
      tag: build
      artifacts: "openblas-linux.zip"
      token: ${{ secrets.GITHUB_TOKEN }}
      allowUpdates: true
      replacesArtifacts: true

# macOS ----------------------------------------------------------------
 openblasmacos:
  name: OPENBLAS (macOS)
  if: ${{ false }}
  runs-on: macos-15-intel
  steps:
   - name: Checkout Git repository
     uses: actions/checkout@v4

   - name: Setup Environment (macOS)
     run: |
      brew install automake
      brew install libtool
      ln -s /usr/local/bin/glibtoolize /usr/local/bin/libtoolize || true

   - name: Build OPENBLAS (macOS)
     env:
      CC: clang
     run: |
      script/openblas-make.sh darwin x86_64 || exit 1

   - name: Release OPENBLAS (macOS)
     uses: ncipollo/release-action@v1
     with:
      tag: build
      artifacts: "openblas-m64.zip"
      token: ${{ secrets.GITHUB_TOKEN }}
      allowUpdates: true
      replacesArtifacts: true

