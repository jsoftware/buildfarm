  runs-on: ubuntu-latest
  steps:
   - name: Checkout Git repository
     uses: actions/checkout@v4

   - name: Build OPENBLAS (OpenBSD)
     uses: cross-platform-actions/action@v1.3.0
     with:
      operating_system: openbsd
      architecture: x86-64
      version: '7.9'
      cpu_count: 4
      shell: bash

      run: |
       rm -f jobdone
       sudo pkg_add -u
       sudo rdate time.cloudflare.com || true
       sudo pkg_add curl wget zip gmake nasm pcre2 libedit automake-1.15.1 libtool dit
       /sbin/ldconfig -r
       export CC=clang
       ls -l /usr/local/bin/auto*
       export AUTOMAKE_VERSION=1.15
       export AUTOCONF_VERSION=2.69
       script/openblas-make.sh openblas || exit 1
       touch jobdone

   - name: Check Status (OpenBSD)
     run: |
      test -f jobdone || exit 1

   - name: Release OPENBLAS (OpenBSD)
     uses: ncipollo/release-action@v1
     with:
      tag: build
      artifacts: "openblas-obsd64.zip"
      token: ${{ secrets.GITHUB_TOKEN }}
      allowUpdates: true
      replacesArtifacts: true

