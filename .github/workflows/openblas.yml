 webhook:
  name: Run Webhook
  runs-on: ubuntu-22.04
  needs: [openblaslinux, openblasmacos, openblasmacosarm, openblasrpi64arm, openblasrpi32arm, openblasfreebsd2, openblasopenbsd2]
  steps:
   - name: update server
     uses: distributhor/workflow-webhook@v2
     env:
      webhook_url: ${{ secrets.WEBHOOK_URL }}
      webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
      data: '{ "id": "openblasbuild" }'
