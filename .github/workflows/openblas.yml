name: OPENBLAS

on:
 push:
  branches: [ master ]

# trigger workflow on file change
#on:
# push:
#  paths:
#   - 'version.txt'

# if: ${{ false }}

env:
 RELEASE: ${{ true }}
 WEBHOOK: ${{ false }}

jobs:

# to run all jobs, enable all
# for selected jobs, disable all and disable the selected needs

 all:
  #if: false
  if: true
  runs-on: ubuntu-latest
  steps:
    - run: echo "Runall jobs"

 slow:
  if: false
  #if: true
  runs-on: ubuntu-latest
  steps:
    - run: echo "Run slow jobs"

 deprecated:
  if: false
  #if: true
  runs-on: ubuntu-latest
  steps:
    - run: echo "Run deprecated jobs"

 disabled:
  if: false
  #if: true
  runs-on: ubuntu-latest
  steps:
    - run: echo "Run disabled jobs"


# linux ----------------------------------------------------------------
 oblinux:
  name: OPENBLAS (Linux)
  needs: all
  runs-on: ubuntu-22.04
  steps:
   - name: Checkout Git repository
     uses: actions/checkout@v4

   - name: Setup Environment (Linux)
     run: script/install-lnx.sh

   - name: Build OPENBLAS (Linux)
     env:
      CC: clang
      HOSTCC: clang
     run: |
      script/openblas-make.sh linux || exit 1

   - name: Release OPENBLAS (Linux)
     if: ${{ env.RELEASE == 'true' }}
     uses: ncipollo/release-action@v1
     with:
      tag: build
      artifacts: "openblas-lnx.zip"
      token: ${{ secrets.GITHUB_TOKEN }}
      allowUpdates: true
      replacesArtifacts: true

# macOS ----------------------------------------------------------------
 obmacos:
  name: OPENBLAS (macOS)
  if: ${{ false }}
  needs: all
  runs-on: macos-15-intel
  steps:
   - name: Checkout Git repository
     uses: actions/checkout@v4

   - name: Setup Environment (macOS)
     run: |
      brew install automake
      brew install libtool
      ln -s /usr/local/bin/glibtoolize /usr/local/bin/libtoolize || true

   - name: Build OPENBLAS (macOS)
     env:
      CC: clang
      HOSTCC: clang
     run: |
      script/openblas-make.sh darwin x86_64 || exit 1

   - name: Release OPENBLAS (macOS)
     if: ${{ env.RELEASE == 'true' }}
     uses: ncipollo/release-action@v1
     with:
      tag: build
      artifacts: "openblas-m64.zip"
      token: ${{ secrets.GITHUB_TOKEN }}
      allowUpdates: true
      replacesArtifacts: true

