# windows msys2 x64 clang ----------------------------------------------
 obwin-msys2-x64-clang:
  name: OPENBLAS (Windows MSYS2 x64 clang)
  needs: all
  runs-on: windows-2022
  steps:
   - name: Checkout Git repository
     uses: actions/checkout@v6

   - name: Setup Environment (Windows MSYS2 x64 clang)
     uses: msys2/setup-msys2@v2
     with:
      msystem: CLANG64
      update: true
      # Install necessary packages (e.g., your build tools, gcc, make)
      install: >-
        mingw-w64-clang-x86_64-clang
        mingw-w64-clang-x86_64-lldb
        mingw-w64-cross-mingw64-binutils
        make
        git

   - name: Build OPENBLAS (Windows MSYS2 x64 clang)
    # Run your build commands within the MSYS2 shell
     shell: msys2 {0}
     env:
      CC: x86_64-w64-mingw32-clang
      CXX: x86_64-w64-mingw32-clang++
      HOSTCC: x86_64-w64-mingw32-clang
      AR: llvm-ar
      RANLIB: llvm-ranlib
      WINDRES: windres
      __MSYS__: 1
      _SSE4_2: 1
     run: |
      script/openblas-make.sh windows x86_64 || exit 1

   - name: Release OPENBLAS (Windows MSYS2 x64 clang)
     if: ${{ env.RELEASE == 'true' }}
     uses: ncipollo/release-action@v1
     with:
      tag: build
      artifacts: "openblas-w64mwc.zip"
      token: ${{ secrets.GITHUB_TOKEN }}
      allowUpdates: true
      replacesArtifacts: true

