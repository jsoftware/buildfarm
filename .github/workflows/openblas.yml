# rpi32 ----------------------------------------------------------------
 oberpi32:
  name: OPENBLAS (Raspberry32)
  if: ${{ false }}
  needs: all
  runs-on: ubuntu-latest
  steps:
   - name: Checkout Git repository
     uses: actions/checkout@v6

   - name: Build OPENBLAS (Raspberry32)
     uses: pguyot/arm-runner-action@v2
     with:
      cpu: arm1176
      cpu_info: cpuinfo/raspberrypi_zero2_w
      base_image: raspios_lite:2023-05-03
      image_additional_mb: 1024
      copy_artifact_path: j32
      commands: |
       apt-get update -y
       apt-get install --no-install-recommends -y clang zip git
       export CC=clang
       script/openblas-make.sh raspberry armv6l || exit 1
       touch jobdone

   - name: Check Status (Raspberry32)
     run: |
      test -f jobdone || exit 1

   - name: Release OPENBLAS (Raspberry32)
     if: ${{ env.RELEASE == 'true' }}
     uses: ncipollo/release-action@v1
     with:
      tag: build
      artifacts: "openblas-rpi32.zip"
      token: ${{ secrets.GITHUB_TOKEN }}
      allowUpdates: true
      replacesArtifacts: true

# openbsd --------------------------------------------------------------
 obopenbsd:
  name: OPENBLAS (OpenBSD cross-platform-actions)
  needs: all
  runs-on: ubuntu-latest
  steps:
   - name: Checkout Git repository
     uses: actions/checkout@v4

   - name: Build OPENBLAS (OpenBSD)
     uses: cross-platform-actions/action@v1.3.0
     with:
      operating_system: openbsd
      architecture: x86-64
      version: '7.9'
      cpu_count: 4
      shell: bash

      run: |
       rm -f jobdone
       sudo pkg_add -u
       sudo rdate time.cloudflare.com || true
       sudo pkg_add curl wget zip gmake git
       export CC=clang
       script/openblas-make.sh openbsd || exit 1
       touch jobdone

   - name: Check Status (OpenBSD)
     run: |
      test -f jobdone || exit 1

   - name: Release OPENBLAS (OpenBSD)
     if: ${{ env.RELEASE == 'true' }}
     uses: ncipollo/release-action@v1
     with:
      tag: build
      artifacts: "openblas-obsd.zip"
      token: ${{ secrets.GITHUB_TOKEN }}
      allowUpdates: true
      replacesArtifacts: true

