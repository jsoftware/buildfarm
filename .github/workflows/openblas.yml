# rpi32 ----------------------------------------------------------------
 openblaserpi32:
  name: OPENBLAS (Raspberry32)
  runs-on: ubuntu-latest
  steps:
   - name: Checkout Git repository
     uses: actions/checkout@v6

   - name: Build, Test OPENBLAS (Raspberry32)
     uses: pguyot/arm-runner-action@v2
     with:
      cpu: arm1176
      cpu_info: cpuinfo/raspberrypi_zero2_w
      base_image: raspios_lite:2023-05-03
      image_additional_mb: 1024
      copy_artifact_path: j32
      commands: |
       apt-get install --no-install-recommends -y clang zip libomp-dev gdb
       export CC=clang
       script/openblas-make.sh raspberry armv6l || exit 1
       touch jobdone

   - name: Check Status (Raspberry32)
     run: |
      test -f jobdone || exit 1

   - name: Release OPENBLAS (Raspberry32)
     uses: ncipollo/release-action@v1
     with:
      tag: build
      artifacts: "openblas-rpi32.zip"
      token: ${{ secrets.GITHUB_TOKEN }}
      allowUpdates: true
      replacesArtifacts: true

# openbsd --------------------------------------------------------------
 openblasopenbsd:
  name: OPENBLAS (OpenBSD vmactions)
  if: ${{ false }}
  runs-on: macos-15-intel
  steps:
   - name: Checkout Git repository
     uses: actions/checkout@v4

   - name: Build OPENBLAS (OpenBSD)
     uses: vmactions/openbsd-vm@v0
     with:
      usesh: true
      sync: sshfs
      prepare: |
       pkg_add -u
       rdate time.cloudflare.com || true
       pkg_add curl wget zip gmake nasm pcre2 libedit automake-1.15.1 libtool git

      run: |
       rm -f jobdone
       /sbin/ldconfig -r
       export CC=clang
       ls -l /usr/local/bin/auto*
       export AUTOMAKE_VERSION=1.15
       export AUTOCONF_VERSION=2.69
       script/openblas-make.sh openblas || exit 1
       touch jobdone

   - name: Check Status (OpenBSD)
     run: |
      test -f jobdone || exit 1

   - name: Release OPENBLAS (OpenBSD)
     uses: ncipollo/release-action@v1
     with:
      tag: build
      artifacts: "openblas-obsd64.zip"
      token: ${{ secrets.GITHUB_TOKEN }}
      allowUpdates: true
      replacesArtifacts: true

# openbsd --------------------------------------------------------------
 openblasopenbsd2:
